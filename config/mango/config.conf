# mango config, ported from config/niri/config.kdl
# Reference: /etc/mango/config.conf and https://github.com/DreamMaoMao/mango/wiki/
# Validate with: mango -c ~/.config/mango/config.conf -p

# Environment
env=DMS_SCREENSHOT_EDITOR,satty
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Autostart (dms itself is started by systemd via mango-session.target)
exec_once=wvkbd-mobintl --alpha 220 --hidden

# Monitors (first matching rule wins, so make/model rules go first)
monitor_rule=make:Apple Computer Inc,model:Color LCD,scale:1.5
monitor_rule=make:Dell Inc.,model:DELL U3223QE,scale:1.5
monitor_rule=name:^HDMI-A-1$,scale:2.0
monitor_rule=name:^DP-1$,scale:1.4
monitor_rule=name:^eDP-1$,scale:1.1

# Keyboard
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us
xkb_rules_variant=mac-iso

# Trackpad
tap_to_click=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# Mouse
mouse_natural_scrolling=1
mouse_left_handed=1
mouse_accel_profile=1

# Appearance
border_radius=0
focused_opacity=0.95
unfocused_opacity=0.70
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=6
gap_outer_vertical=6
animation_duration_tag=0

# Scroller layout 
scroller_default_proportion=0.5
scroller_proportion_preset=0.3,0.5,0.7,1.0
scroller_focus_center=0
scroller_prefer_center=1

# Tags 1-4 
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# Window rules
window_rule=is_floating:1,app_id:firefox$,title:^Picture-in-Picture$
window_rule=is_floating:1,app_id:org.quickshell$
window_rule=is_floating:1,force_tiled_state:1,app_id:org.kde.kdeconnect.daemon

# Apps / shell
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,dms ipc spotlight toggle
bind=SUPER,e,spawn,dolphin
bind=SUPER,b,spawn,dms ipc bar toggle index 0
bind=SUPER,w,spawn,~/.local/bin/start-pomodoro
bind=SUPER,g,spawn,dms ipc launcher openQuery gif
bind=SUPER,n,spawn,dms ipc call notifications toggle
bind=SUPER+SHIFT,n,spawn,dms ipc call notepad toggle
bind=SUPER+SHIFT,comma,spawn,dms ipc settings toggle
bind=SUPER+SHIFT,slash,spawn,dms ipc keybinds toggle mango
bind=CTRL+ALT,Delete,spawn,dms ipc call processlist toggle
bind=ALT+SHIFT,Insert,spawn,dms ipc clipboard toggle
bind=SUPER+CTRL+SHIFT+ALT,l,spawn,dms ipc lock lock
bind=SUPER+SHIFT,e,quit
bind=SUPER,q,killclient

# Screenshots
bind=SUPER+SHIFT,s,spawn,dms screenshot region
bind=SUPER+CTRL,s,spawn,dms screenshot full
bind=SUPER+ALT,s,spawn,dms screenshot window

# Overview / window switcher (niri recent-windows)
bind=SUPER,grave,toggleoverview
bind=ALT,Tab,switcher,all_next
bind=ALT+SHIFT,Tab,switcher,all_prev

# Focus: H/L columns, J/K window-or-workspace
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focus_window_or_workspace,down
bind=SUPER,k,focus_window_or_workspace,up

# Move: H/L swap columns, J/K move to next/previous workspace
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,j,tagtoright
bind=SUPER+SHIFT,k,tagtoleft

# Monitors
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,j,tagmon,down
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,l,tagmon,right

# Columns (scroller stacks)
bind=SUPER,o,scroller_stack,left
bind=SUPER,p,scroller_stack,right
bind=SUPER,r,switch_proportion_preset
bind=SUPER,m,togglemaximizescreen
bind=SUPER+CTRL,m,set_proportion,1.0
bind=SUPER+SHIFT,equal,resizewin,+0,+50
bind=SUPER+SHIFT,minus,resizewin,+0,-50

# Window state
bind=SUPER,f,togglefloating
bind=SUPER+SHIFT,m,togglefullscreen

# Workspaces: 1 terminal, 2 browser, 3 music, 4 chat
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0

# Media keys (work while locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc audio increment 5
bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc audio decrement 5
bindl=NONE,XF86AudioMute,spawn,dms ipc audio mute
bindl=NONE,XF86AudioMicMute,spawn,dms ipc audio toggle-mic-mute
bindl=NONE,XF86AudioPlay,spawn,dms ipc mpris playPause
bindl=NONE,XF86AudioNext,spawn,dms ipc mpris next
bindl=NONE,XF86AudioPrev,spawn,dms ipc mpris previous
bindl=NONE,XF86AudioStop,spawn,dms ipc mpris pause
bindl=NONE,XF86MonBrightnessUp,spawn,dms ipc brightness increment 10 backlight:intel_backlight
bindl=NONE,XF86MonBrightnessDown,spawn,dms ipc brightness decrement 10 backlight:intel_backlight

# No mango equivalent, left unbound:
#   Mod+Home/End, Mod+Shift+Home/End  (focus/move to first/last column)
#   Mod+Shift+O/P                     (consume/expel only; Mod+O/P do both)
#   Mod+Shift+R, Mod+Ctrl+R           (window height presets / reset)
#   Mod+Shift+F                       (switch focus floating <-> tiling)
#   Mod+Y, Mod+Shift+Y                (move workspace to monitor)
#   Mod+Escape                        (toggle shortcuts inhibit)
#   Super+Shift+T                     (tabbed column)

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Files generated by DMS (colors, outputs, layout, ...). Last, so they win.
source_optional=./dms/colors.conf
source_optional=./dms/outputs.conf
source_optional=./dms/layout.conf
source_optional=./dms/cursor.conf
source_optional=./dms/input.conf
source_optional=./dms/windowrules.conf
source_optional=./dms/binds.conf
